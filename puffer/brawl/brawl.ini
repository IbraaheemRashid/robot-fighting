[base]
env_name = brawl

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 4
num_policies = 2
hist_policy_percent = 0.2
hist_policy_hidden_size = 256
hist_policy_num_layers = 3

# Selfplay: slot 0 is the primary policy, slot 1 is a frozen checkpoint on
# hist_policy_percent of the envs. Final score is mean env/perf vs eval_bots.
[selfplay]
enabled = 1
max_size = 64
seed = 42
opp_timeout_steps = 50_000_000
eval_pool_size = 8
eval_games = 4096
eval_bot_games = 4096
eval_bots = 0,1,2

# 1v1: num_agents + num_bots must be 2. To train against a scripted bot:
# ./puffer train --env.num_agents=1 --env.num_bots=1 --env.bot_policy=2
#     --selfplay.enabled=0 --vec.num_policies=1
[env]
num_agents = 2
num_bots = 0
bot_policy = 2
max_ticks = 2700
stocks = 3
# Shaping so early policies learn to hit. 0.02 beats the rush bot in ~50M
# steps; the 500M selfplay run in README.md used this value.
damage_reward = 0.02

[policy]
hidden_size = 256
num_layers = 3

[train]
total_timesteps = 500_000_000
learning_rate = 0.003
gamma = 0.99
gae_lambda = 0.9
clip_coef = 0.2
vf_coef = 2
ent_coef = 0.001
minibatch_size = 8192
horizon = 64
